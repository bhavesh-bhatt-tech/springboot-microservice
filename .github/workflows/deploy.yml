name: Build and Publish Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: maven

      - name: Build with Maven
        run: mvn clean install

      - name: Build & push Config Server Docker image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: bkbdocker/config-server
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: config-server
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Service Registry Docker image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: bkbdocker/service-registry
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: service-registry
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Gateway Service Docker image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: bkbdocker/gateway-service
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: gateway-service
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Department Service Docker image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: bkbdocker/department-service
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: department-service
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Employee Service Docker image
        uses: mr-smithers-excellent/docker-build-push@v5
        with:
          image: bkbdocker/employee-service
          tags: latest
          registry: docker.io
          dockerfile: Dockerfile
          directory: employee-service
          enableBuildKit: true
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

